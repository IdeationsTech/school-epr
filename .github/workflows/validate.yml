name: Validate foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mysql-and-frontend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: school_erp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: school_erp_test
      DB_USERNAME: root
      DB_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, xml, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan test
      - run: php artisan migrate:fresh --seed --force
      - run: php artisan migrate:rollback --force
      - run: php artisan migrate --seed --force
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Seed browser fixture
        env:
          DEMO_ADMIN_PASSWORD: BrowserTestPassword123!
        run: |
          php artisan db:seed --class=DemoSchoolSeeder --force
          php artisan db:seed --class=PlatformBrowserSeeder --force
      - name: Start local test server
        run: APP_ENV=local php artisan serve --host=127.0.0.1 --port=8001 > /tmp/school-server.log 2>&1 &
      - name: Browser functional checks
        run: npx playwright test
      - name: Browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-browser-results
          path: test-results
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-dependency-locks
          path: |
            composer.lock
            package-lock.json
